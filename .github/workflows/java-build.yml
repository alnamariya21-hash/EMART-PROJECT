name: Java and MySQL Integration
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  compile-and-db-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptestpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      EMART_DB_USER: root
      EMART_DB_PASSWORD: testpass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build standalone JAR and fetch JDBC driver
        run: bash build.sh
      - name: Verify icon resources were packaged
        run: |
          for icon in electronics grocery sports clothes stationery others; do
            jar tf dist/EMartProject.jar | grep -F "emartproject/images/${icon}.png"
          done
      - name: Compile headless database test
        run: |
          mkdir -p build/test-classes
          javac -encoding UTF-8 -cp "dist/EMartProject.jar:lib/mysql-connector-j-9.4.0.jar" -d build/test-classes tests/DatabaseSmokeTest.java
      - name: Ensure application bytecode runs on Java 8
        run: javap -verbose -classpath dist/EMartProject.jar emartproject.DatabaseCheck | grep -F 'major version: 52'
      - name: Switch to Java 8 for compatibility regression test
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Exercise JDBC persistence and checkout on Java 8
        run: java -cp "build/test-classes:dist/EMartProject.jar:lib/mysql-connector-j-9.4.0.jar" DatabaseSmokeTest
